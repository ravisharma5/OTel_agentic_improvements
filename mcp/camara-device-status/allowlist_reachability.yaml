# CAMARA Device Reachability Status allowlist (documentation only -- explicit @mcp.tool() used)
# Multi-spec domains use hand-written tools to avoid MCPServerRegistration double-prefixing.
server_name: mcp-camara-device-status
spec_path: specs/camara_device_reachability_status.yaml
backend_env_var: CAMARA_REACHABILITY_BASE_URL
operations:
  - operation_id: getReachabilityStatus
    path: /retrieve
    method: POST
    tool_name: get_reachability_status
    description: Get a device's current network reachability status
