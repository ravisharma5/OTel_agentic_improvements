[project]
name = "mcp-camara-device-status"
version = "0.1.0"
description = "CAMARA Device Status MCP server -- roaming, reachability, and connected network type tools"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx2>=2.13.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-camara-device-status = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
