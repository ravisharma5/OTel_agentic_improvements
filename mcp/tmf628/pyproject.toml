[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tmf628"
version = "0.1.0"
description = "TMF628 Performance Management MCP server (5 tools)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx2>=2.13.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.34.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
