# MCP-Telecom Device Inventory -- Containerlab Basic Scenario
# ============================================================
#
# 3x Nokia SR Linux devices deployed via Containerlab.
# Management IPs from 172.20.20.0/24 subnet (Containerlab default).
#
# CREDENTIAL MANAGEMENT (OpenShift Deployment)
# ---------------------------------------------
# The default Nokia SRL credentials (admin/NokiaSrl1!) are used for
# local Containerlab testing. For OpenShift deployment, move credentials
# to a Kubernetes Secret and reference via environment variables:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: mcp-telecom-device-creds
#     namespace: otel25-mcp
#   type: Opaque
#   data:
#     CLAB_DEVICE_USERNAME: YWRtaW4=       # admin
#     CLAB_DEVICE_PASSWORD: Tm9raWFTcmwxIQ==  # NokiaSrl1!
#
# When deployed via Clabernetes on OpenShift, update hosts to Kubernetes
# service names:
#   r1: host: "r1.c9s.svc.cluster.local"
#   r2: host: "r2.c9s.svc.cluster.local"
#   r3: host: "r3.c9s.svc.cluster.local"
#
# DeviceManager.load_config() expects a top-level dict keyed by device name.
# Each device must have: host, device_type, port, timeout, username, password.

r1:
  host: "172.20.20.2"
  device_type: "nokia_sros"
  port: 22
  timeout: 30
  username: "admin"
  password: "NokiaSrl1!"

r2:
  host: "172.20.20.3"
  device_type: "nokia_sros"
  port: 22
  timeout: 30
  username: "admin"
  password: "NokiaSrl1!"

r3:
  host: "172.20.20.4"
  device_type: "nokia_sros"
  port: 22
  timeout: 30
  username: "admin"
  password: "NokiaSrl1!"
