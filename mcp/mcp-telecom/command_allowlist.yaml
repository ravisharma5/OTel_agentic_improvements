# MCP-Telecom Command Allowlist
# ==============================
#
# DENY-BY-DEFAULT SAFETY MECHANISM
# ---------------------------------
# validate_command() in safety.py enforces this allowlist as Gate 2 (CR-01).
# Commands must pass BOTH the safety regex check (read-only prefixes, no
# blocked patterns) AND match a prefix in this list.
#
# An empty `allowed_commands` list rejects ALL commands. This ensures no
# commands execute on network devices until explicitly permitted below.
#
# FORMAT:
# Each entry is a command prefix. A command is allowed if it starts with
# any prefix in this list (case-insensitive match in validate_command).
#
# COVERAGE:
# These prefixes cover MCP-Telecom's 58 device-layer tools across:
#   - Nokia SR OS / SR Linux: show, display families
#   - Cisco IOS / IOS-XR / NX-OS: show family
#   - Juniper Junos: show family
#   - Arista EOS: show family
#   - Diagnostics: ping, traceroute

allowed_commands:
  # --- BGP / Routing ---
  - "show bgp"
  - "show bgp summary"
  - "show bgp neighbors"
  - "show ip bgp"
  - "show ip route"
  - "show routing"
  - "show route"
  - "show router"

  # --- Interfaces ---
  - "show interfaces"
  - "show interface"
  - "show port"

  # --- MPLS ---
  - "show mpls"

  # --- LLDP / Neighbors ---
  - "show lldp"
  - "show lldp neighbors"

  # --- LAG / Link aggregation ---
  - "show lag"

  # --- System / Platform ---
  - "show system"
  - "show version"
  - "show chassis"
  - "show running-config"
  - "show startup-config"
  - "show inventory"
  # 2026-10-14: SR Linux models chassis/environment info under a top-level
  # "platform" context (not "show chassis" as the comment above's "SR OS /
  # SR Linux" grouping assumed) and ARP/ND under "arpnd" -- confirmed live
  # via SR Linux's own CLI error listing valid top-level tokens. Added for
  # the new nokia_srlinux vendor mapping's chassis/arp_table operations.
  - "show platform"
  - "show arpnd"

  # --- Logging ---
  - "show log"

  # --- Services / Network instances ---
  - "show service"
  - "show network-instance"

  # --- Nokia display family (SR OS classic CLI) ---
  - "display version"
  - "display interfaces"
  - "display bgp"
  - "display ip routing-table"
  - "display mpls"
  - "display lldp"

  # --- Diagnostics ---
  - "ping"
  - "traceroute"
