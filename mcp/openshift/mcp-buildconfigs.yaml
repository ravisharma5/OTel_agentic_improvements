# MCP domain server BuildConfigs -- one per server in mcp/<dir>/.
# Reconstructed 2026-10-13: these only ever existed live (sandbox1330/3435),
# never committed, discovered as a gap while deploying sandbox4001 from scratch.
# Each is a plain Binary Docker-strategy build, context = the server's own
# directory (each has a self-contained Dockerfile, no shared build deps).
#
# Deploy: oc apply -f this-file.yaml, then for each (name, dir) pair:
#   oc start-build <name> -n otel25-mcp --from-dir=mcp/<dir> --follow
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: mcp-camara-device-status
  namespace: otel25-mcp
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mcp-camara-device-status
  namespace: otel25-mcp
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: mcp-camara-device-status:latest
---
