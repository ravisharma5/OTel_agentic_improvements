apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-nwdaf
  namespace: otel25-mcp
  labels:
    app: mcp-nwdaf
    layer: mcp
    domain: nwdaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-nwdaf
  template:
    metadata:
      labels:
        app: mcp-nwdaf
        layer: mcp
        domain: nwdaf
    spec:
      containers:
      - name: mcp-nwdaf
        image: image-registry.openshift-image-registry.svc:5000/otel25-mcp/mcp-nwdaf:latest
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        volumeMounts:
        - name: backend-routing
          mountPath: /config/backend-routing
          readOnly: true
      volumes:
      - name: backend-routing
        configMap:
          name: backend-routing
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-nwdaf
  namespace: otel25-mcp
  labels:
    app: mcp-nwdaf
    layer: mcp
    domain: nwdaf
spec:
  selector:
    app: mcp-nwdaf
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
