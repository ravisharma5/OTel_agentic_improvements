# Clabernetes Topology custom resource for the MCP-Telecom basic 3-node Nokia SRL ring.
#
# Deploy prerequisites (one-time, namespace c9s):
#   helm upgrade --install --create-namespace --namespace c9s clabernetes \
#     oci://ghcr.io/srl-labs/clabernetes/clabernetes
#   oc adm policy add-scc-to-user anyuid -n c9s -z clabernetes-service-account
#   oc adm policy add-scc-to-user anyuid -n c9s -z clabernetes-manager
#   oc adm policy add-scc-to-user privileged -n c9s -z clabernetes-launcher-service-account
#
# Notes on the SCC grants above (discovered during live deployment, 2026-10-05):
#   - clabernetes-manager / clabernetes-service-account (the controller pods) only need
#     `anyuid` -- they fail under the default `restricted-v2` SCC because their webhook
#     cert files are owned by a fixed UID the random restricted-v2 UID can't read.
#   - clabernetes-launcher-service-account (the per-node pods that run containerlab/docker
#     nested inside the pod) need the actual `privileged` SCC -- they run
#     `securityContext.privileged: true` + `runAsUser: 0` for docker-in-docker, which no
#     non-privileged SCC permits.
#
# Deploy this topology:
#   oc apply -f mcp/openshift/clabernetes-topology-cr.yaml
#
# Verify:
#   oc get topology -n c9s
#   oc get pods -n c9s -l clabernetes/topologyOwner=mcp-telecom-basic
#   oc exec deploy/mcp-telecom -n otel25-mcp -- python3 -c \
#     "import socket; s=socket.create_connection(('mcp-telecom-basic-r1.c9s.svc.cluster.local', 22), timeout=10); print(s.recv(100))"
#
# clabverter was unavailable in the deployment environment used to verify this (no local
# containerlab/clabverter binary, podman machine not running); this CR was constructed
# directly since the Topology CRD's spec.definition.containerlab field just accepts the
# raw containerlab topology YAML as a string -- clabverter is a convenience wrapper around
# exactly this, not a hard requirement.

apiVersion: clabernetes.containerlab.dev/v1alpha1
kind: Topology
metadata:
  name: mcp-telecom-basic
  namespace: c9s
spec:
  # 2026-10-14: r1/r2/r3 (Nokia SR Linux, a full commercial network OS, not a
  # lightweight simulator) ran with NO memory limit at all -- confirmed live
  # via `oc get deploy -o json` across this whole project, these were the
  # only app containers found without one. Investigating sandbox4001's 4th
  # node-level memory-exhaustion failure in one day (04-LEARNINGS.md), these
  # three were the only workload showing a real leak signature: consistent
  # ~150-230MB/hour linear growth, reproduced across multiple independent
  # restarts, all three growing in lockstep in the same time windows -- every
  # other component checked (MCP servers, NextGCore NFs, Prism mocks,
  # kubelet/crio/ovs-vswitchd, conntrack) was flat. Running `privileged: true,
  # runAsUser: 0` for the network-namespace/veth manipulation SR Linux needs
  # to boot inside Clabernetes, which plausibly explains why the leak showed
  # up as unattributed host-level AnonPages rather than this container's own
  # cgroup memory. Root cause inside SR Linux/Clabernetes itself is not yet
  # confirmed (needs the memory-watchdog DaemonSet to catch a live
  # occurrence) -- this limit doesn't fix the leak, it bounds the blast
  # radius: Kubernetes' own OOM-killer now restarts a leaking instance at a
  # few GiB instead of letting it consume the whole node.
  #
  # 2026-10-14, later same day: the 2Gi limit above IS correctly enforced
  # (confirmed from the host: reading the real cgroup's memory.max showed
  # exactly 2147483648 bytes) -- a 5th sandbox4001 node death that day
  # traced back to a pod instance that predated this patch's rollout, not a
  # bypass of the limit. But a *fresh* pod under the 2Gi cap was already at
  # ~99% of it within ~10 minutes of starting, flat/idle, with zero
  # SSH/CLI traffic -- SR Linux's own baseline (nested dockerd/containerd
  # plus ~30 internal json_rpc_server_main worker processes) eats nearly
  # the whole 2Gi by itself. That's too little headroom: any real CLI/SSH
  # load pushes it over and triggers a container OOM-restart (safe, but
  # disruptive to in-flight pipeline tool calls). Bumped to 4Gi/2 CPU so a
  # leak has somewhere to grow into before getting killed, instead of
  # living permanently at the edge.
  deployment:
    resources:
      default:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
  definition:
    containerlab: |
      # Containerlab topology for MCP-Telecom basic 3-node Nokia SRL ring
      # Generated from ContainerlabManager.generate_test_scenario("basic"), then hand-corrected
      # after live deployment testing against Clabernetes 0.6.0 / containerlab 0.74.3 (2026-10-05):
      #
      #   1. Removed `startup-config: configs/r*.cfg` -- these files were never generated
      #      anywhere in the repo; containerlab failed trying to load a nonexistent file.
      #      Nokia SR Linux boots fine with factory-default config without one.
      #   2. Renamed link endpoints from generic `eth1`/`eth2` to Nokia SR Linux's native
      #      `e1-1`/`e1-2` format. containerlab 0.74.3 does NOT auto-translate generic
      #      ethN names for the nokia_srlinux kind -- it requires the native
      #      ethernet-L/P (or eL-P) pattern directly and errors otherwise. This is a
      #      pre-existing limitation of containerlab.py's generic `_next_eth()` helper
      #      (mcp/mcp-telecom/src/mcp_telecom/containerlab.py:60-63), which emits plain
      #      `ethN` for every vendor kind -- not something introduced by this change.
      #      Future scenarios using nokia_srlinux should account for this until/unless
      #      `_next_eth()` is made kind-aware.
      #   3. 2026-10-14: added per-node `memory`/`cpu`. spec.deployment.resources above
      #      only constrains the OUTER launcher pod (dockerd/containerd/clabernetes
      #      overhead) -- confirmed live via the real host cgroups that the actual
      #      nokia_srlinux container Docker-in-Docker spawns lives in its own top-level
      #      cgroup (/sys/fs/cgroup/docker/<id>, a sibling of kubepods.slice, not a
      #      child of it), entirely outside Kubernetes' resource accounting. That's why
      #      r1/r2/r3 could leak to 25-44GB RSS and kill a node even with the outer pod
      #      limit correctly enforced -- it was protecting the wrong cgroup the whole
      #      time. containerlab's own per-node `memory`/`cpu` fields (confirmed present
      #      in this image's binary: `yaml:"memory,omitempty"`/`yaml:"cpu,omitempty"`)
      #      pass straight through to the inner `docker create`'s HostConfig, which is
      #      the only thing that actually constrains this container's real cgroup.
      #
      # Deploy:
      #   sudo containerlab deploy -t containerlab-topology.yaml
      #
      # Clabernetes on OpenShift (verified working 2026-10-05, namespace c9s):
      #   oc apply -f <Topology CR wrapping this file's content under spec.definition.containerlab>
      #   (clabverter was unavailable in the deployment environment; the Topology CR's
      #   spec.definition.containerlab field accepts this raw containerlab YAML directly,
      #   so clabverter is not strictly required -- see clabernetes.containerlab.dev/v1alpha1 CRD)
      #
      # Nodes: r1, r2, r3 (Nokia SR Linux) in a ring topology
      # Management subnet: 172.20.20.0/24
      #   r1 -> 172.20.20.2
      #   r2 -> 172.20.20.3
      #   r3 -> 172.20.20.4

      name: mcp-telecom-basic
      mgmt:
        network: clab
        ipv4-subnet: 172.20.20.0/24
      topology:
        nodes:
          r1:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
            memory: 3gb
            cpu: 2
          r2:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
            memory: 3gb
            cpu: 2
          r3:
            kind: nokia_srlinux
            image: ghcr.io/nokia/srlinux:latest
            memory: 3gb
            cpu: 2
        links:
        - endpoints:
          - r1:e1-1
          - r2:e1-1
        - endpoints:
          - r2:e1-2
          - r3:e1-1
        - endpoints:
          - r3:e1-2
          - r1:e1-2
