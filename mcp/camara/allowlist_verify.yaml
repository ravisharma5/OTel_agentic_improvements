# CAMARA Device Location Verification allowlist (documentation only -- explicit @mcp.tool() used)
# Per D-10a: multi-spec domains use hand-written tools to avoid MCPServerRegistration double-prefixing.
server_name: mcp-camara
spec_path: specs/camara_location_verification.yaml
backend_env_var: CAMARA_BASE_URL
operations:
  - operation_id: verifyLocation
    path: /verify
    method: POST
    tool_name: verify_location
    description: Verify whether a device is at a specific location within an accuracy radius
