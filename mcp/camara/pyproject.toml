[project]
name = "mcp-camara"
version = "0.1.0"
description = "CAMARA Device Location MCP server -- location verification and retrieval tools"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx2>=2.13.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-camara = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
