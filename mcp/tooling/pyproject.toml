[project]
name = "otel25-mcp-tooling"
version = "0.1.0"
description = "OpenAPI-to-MCP conversion CLI for OTel 2.5 telecom tool-calling training"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
openapi-to-mcp = "openapi_to_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]
