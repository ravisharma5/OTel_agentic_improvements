# NWDAF EventsSubscription allowlist (documentation only -- explicit @mcp.tool() used instead of CLI)
# Per D-10a: multi-spec domains use hand-written tools to avoid MCPServerRegistration double-prefixing.
server_name: mcp-nwdaf
spec_path: specs/nwdaf_eventssubscription_rel16.yaml
backend_env_var: NWDAF_BASE_URL
operations:
  - operation_id: CreateNWDAFEventsSubscription
    path: /subscriptions
    method: POST
    tool_name: subscribe_nwdaf_events
    description: Subscribe to NWDAF analytics event notifications
  - operation_id: DeleteNWDAFEventsSubscription
    path: /subscriptions/{subscriptionId}
    method: DELETE
    tool_name: unsubscribe_nwdaf_events
    description: Unsubscribe from NWDAF analytics event notifications
