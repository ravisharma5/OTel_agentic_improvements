[project]
name = "mcp-nwdaf"
version = "0.1.0"
description = "NWDAF TS 29.520 MCP server -- analytics and events subscription tools"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx2>=2.13.1",
    "h2>=4.1.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-nwdaf = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
