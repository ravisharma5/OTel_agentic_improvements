# ============================================================================
# UPF (User Plane Function - separate pod, custom SCC)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: upf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upf
        app.kubernetes.io/part-of: nextgcore
    spec:
      serviceAccountName: nextgcore-upf
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.otel25-backends.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: upf
          image: image-registry.openshift-image-registry.svc:5000/otel25-backends/nextgcore-runtime:latest
          command: ["/usr/local/bin/nextgcore-upfd"]
          args: ["-c", "/etc/nextgcore/upf.yaml"]
          ports:
            - containerPort: 8805
              name: pfcp
              protocol: UDP
            - containerPort: 2152
              name: gtpu
              protocol: UDP
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/upf.yaml
              subPath: upf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: logs
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: upf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: upf
  ports:
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
  type: ClusterIP

# ============================================================================
# NWDAF (Network Data Analytics Function - the target)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwdaf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/part-of: nextgcore
    api: nwdaf
    path: nextgcore-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nwdaf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nwdaf
        app.kubernetes.io/part-of: nextgcore
        api: nwdaf
        path: nextgcore-live
    spec:
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.otel25-backends.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: nwdaf
          image: image-registry.openshift-image-registry.svc:5000/otel25-backends/nextgcore-runtime:latest
          command: ["/usr/local/bin/nextgcore-nwdafd"]
          args:
            - "-c"
            - "/etc/nextgcore/nwdaf.yaml"
            - "--sbi-port"
            - "7777"
            - "--nrf-uri"
            - "http://nrf.otel25-backends.svc.cluster.local:7777"
          ports:
            - containerPort: 7777
              name: sbi
          env:
            - name: RUST_LOG
              value: info
            - name: NEXTGCORE_SBI_PROFILE
              value: dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/nwdaf.yaml
              subPath: nwdaf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: logs
          emptyDir: {}
