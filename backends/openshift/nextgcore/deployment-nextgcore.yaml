# ============================================================================
# AMF (Access and Mobility Management Function)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amf
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nrf.otel25-backends.svc.cluster.local 7777; do echo waiting for nrf; sleep 2; done']
      containers:
        - name: amf
          image: image-registry.openshift-image-registry.svc:5000/otel25-backends/nextgcore-runtime:latest
          command: ["/usr/local/bin/nextgcore-amfd"]
          args: ["-c", "/etc/nextgcore/amf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
            - containerPort: 38412
              name: ngap
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
            - name: NEXTGCORE_SBI_PROFILE
              value: dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/amf.yaml
              subPath: amf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          # AMF binds SBI to 127.0.0.1 in dev mode, so tcpSocket probe
          # (which connects via pod IP) fails. Use exec probe instead.
          readinessProbe:
            exec:
              command: ['sh', '-c', 'curl -sf http://127.0.0.1:7777/health || ss -tln | grep -q 7777']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['sh', '-c', 'curl -sf http://127.0.0.1:7777/health || ss -tln | grep -q 7777']
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: amf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: amf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: amf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    - name: ngap
      port: 38412
      targetPort: 38412
  type: ClusterIP

