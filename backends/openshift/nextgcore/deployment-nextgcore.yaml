# NextGCore Split Deployment for OpenShift (Path A - Real NWDAF)
#
# Deploys the minimum set of NextGCore NFs required for NWDAF NF_LOAD analytics:
#   - MongoDB (data store for UDR)
#   - NRF (NF registry, must start first)
#   - AUSF, UDM, UDR (authentication/subscriber data)
#   - AMF, SMF (access/session management)
#   - UPF (user plane, separate pod with custom SCC)
#   - NWDAF (analytics function, the target)
#
# Each NF runs in its own Deployment+Service (not a monolithic pod) because
# all NFs listen on SBI port 7777 - sharing a pod would cause port conflicts.
#
# All SBI endpoints use HTTP/2 h2c (per Plan 02 findings). Probes use tcpSocket
# since Kubernetes httpGet probes default to HTTP/1.1.
#
# All NF images use the unified nextgcore-runtime image built in-cluster via
# OpenShift BuildConfig (Docker strategy) to avoid ARM64-to-amd64 cross-
# compilation issues. Each Deployment overrides the command with the specific
# NF binary name (nextgcore-{nf}d pattern).

# ============================================================================
# MongoDB (required by UDR for subscriber data)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: nextgcore
    spec:
      containers:
        - name: mongodb
          image: docker.io/library/mongo:6.0
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP

# ============================================================================
# NRF (Network Repository Function - must start first)
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/part-of: nextgcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nrf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nrf
        app.kubernetes.io/part-of: nextgcore
    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb.otel25-backends.svc.cluster.local 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: nrf
          image: image-registry.openshift-image-registry.svc:5000/otel25-backends/nextgcore-runtime:latest
          command: ["/usr/local/bin/nextgcore-nrfd"]
          args: ["-c", "/etc/nextgcore/nrf.yaml"]
          ports:
            - containerPort: 7777
              name: sbi
          env:
            - name: RUST_LOG
              value: info
            - name: NEXTGCORE_SBI_PROFILE
              value: dev
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nextgcore/nrf.yaml
              subPath: nrf.yaml
              readOnly: true
            - name: logs
              mountPath: /var/log/nextgcore
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: nextgcore-configs
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nrf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: nrf
    app.kubernetes.io/part-of: nextgcore
spec:
  selector:
    app.kubernetes.io/name: nrf
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
  type: ClusterIP

