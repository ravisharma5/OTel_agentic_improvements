# NWDAF ClusterIP Service (Path A - NextGCore Live)
#
# Service name: nextgcore-nwdaf (consistent naming for downstream consumers)
# Port: 7777 (SBI port, HTTP/2 h2c protocol)
#
# The ConfigMap backend-routing references this Service as the NWDAF_BASE_URL.
# Phase 2/3 MCP servers consume the ConfigMap URL, not this Service directly.
apiVersion: v1
kind: Service
metadata:
  name: nextgcore-nwdaf
  namespace: otel25-backends
  labels:
    app.kubernetes.io/name: nwdaf
    app.kubernetes.io/part-of: nextgcore
    api: nwdaf
    path: nextgcore-live
spec:
  selector:
    app.kubernetes.io/name: nwdaf
  ports:
  - name: sbi
    port: 7777
    targetPort: 7777
    protocol: TCP
  type: ClusterIP
