# Backend Routing ConfigMap (D-14: per-API routing, D-15: plain ConfigMap)
#
# === SINGLE SOURCE OF TRUTH (D-17) ===
#
# This file in the otel25-backends namespace is the CANONICAL ConfigMap.
# A copy exists in otel25-mcp (Kubernetes ConfigMaps are namespace-scoped).
# After any edit to this file, run:
#
#   scripts/sync-backend-routing.sh
#
# to propagate changes to the otel25-mcp namespace copy. Failure to sync
# causes silent backend routing drift between the two namespaces.
#
# === CONSUMER CONTRACT (BACK-03: no-redeploy switching) ===
#
# This ConfigMap is intended to be consumed by Phase 2/3 MCP servers via
# VOLUME MOUNT (not envFrom/env).
#
# Volume-mounted ConfigMaps are updated by the kubelet within ~1 minute of
# a ConfigMap edit, enabling live switching without pod restart. To achieve
# this, consumers MUST:
#   1. Mount the ConfigMap as a volume (not use envFrom or individual env entries)
#   2. Implement file-watching or periodic re-reading of the mounted file
#   3. Use the mounted file contents as the backend URL at request time
#
# Env-var-based consumption (envFrom or individual env entries) reads values
# only at pod startup. Changing the ConfigMap with env-var consumers would
# require a pod restart to take effect, which does NOT satisfy BACK-03's
# "switch without redeploying services" criterion.
#
# Phase 2/3 MCP servers MUST use volume-mounted ConfigMap files and implement
# file-watching or periodic re-reading of the mounted file to achieve live
# backend switching per D-15 and BACK-03.
#
# === SWITCHING CONTRACT ===
#
# To switch a backend URL (e.g., from Prism mock to NextGCore live):
#   oc patch configmap backend-routing -n otel25-backends \
#     --type merge -p '{"data":{"NWDAF_BASE_URL":"http://nextgcore-nwdaf.otel25-backends.svc.cluster.local:7777"}}'
#
# Then run: scripts/sync-backend-routing.sh
#
# No pod restart is needed for volume-mounted consumers. The kubelet
# propagates the change within ~60 seconds (configurable via kubelet
# syncFrequency).
#
# === NWDAF PATH NOTE ===
#
# Prism NWDAF (Path B) serves analytics at /analytics (Prism strips server base path).
# NextGCore NWDAF (Path A) serves at /nnwdaf-analyticsinfo/v1/analytics.
# Consumers should use the NWDAF_BASE_URL + the appropriate path for their backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-routing
  namespace: otel25-backends
  labels:
    purpose: backend-routing
    phase: "4"
data:
  # TMF API endpoints (Prism mock backends from Plan 03)
  TMF642_BASE_URL: "http://prism-tmf642.otel25-backends.svc.cluster.local:4010"
  TMF628_BASE_URL: "http://prism-tmf628.otel25-backends.svc.cluster.local:4010"
  TMF621_BASE_URL: "http://prism-tmf621.otel25-backends.svc.cluster.local:4010"

  # CAMARA Device Location API endpoints (Prism mock backends from Plan 03)
  CAMARA_BASE_URL: "http://prism-camara.otel25-backends.svc.cluster.local:4010"
  CAMARA_RETRIEVAL_BASE_URL: "http://prism-camara-retrieval.otel25-backends.svc.cluster.local:4010"

  # CAMARA Device Status API endpoints (Prism mock backends, Phase 6)
  # No live backend exists for CAMARA Device Status in this project (unlike NWDAF's
  # NextGCore reference core) -- same Prism-mock pattern as Device Location.
  CAMARA_ROAMING_BASE_URL: "http://prism-camara-roaming.otel25-backends.svc.cluster.local:4010"
  CAMARA_REACHABILITY_BASE_URL: "http://prism-camara-reachability.otel25-backends.svc.cluster.local:4010"
  CAMARA_NETWORK_TYPE_BASE_URL: "http://prism-camara-network-type.otel25-backends.svc.cluster.local:4010"

  # NWDAF Analytics endpoint (NextGCore live, Path A)
  # Port 7777 = NextGCore SBI port (HTTP/2 h2c)
  # Base path included directly -- NextGCore serves analytics at
  # /nnwdaf-analyticsinfo/v1/analytics, not at root. Without this suffix the
  # server gets a 404 even once the h2c transport itself is working correctly.
  NWDAF_BASE_URL: "http://nextgcore-nwdaf.otel25-backends.svc.cluster.local:7777/nnwdaf-analyticsinfo/v1"

  # NWDAF Events Subscription endpoint (NextGCore live, Path A)
  # Same host as NWDAF_BASE_URL -- path divergence is handled in code.
  # NextGCore EventsSubscription uses /nnwdaf-eventssubscription/v1 base path
  # (different from AnalyticsInfo's /nnwdaf-analyticsinfo/v1).
  # For Prism, both specs serve at root, so this can match NWDAF_BASE_URL.
  NWDAF_EVENTS_BASE_URL: "http://nextgcore-nwdaf.otel25-backends.svc.cluster.local:7777"

  # NWDAF HTTP transport protocol selection
  # "h2c" = HTTP/2 cleartext prior-knowledge (for NextGCore SBI port)
  # "http1.1" = standard HTTP/1.1 (for Prism or other HTTP/1.1 backends)
  # When switching NWDAF to Prism, change this to "http1.1".
  NWDAF_PROTOCOL: "h2c"

  # UDR authentication-subscription endpoint (NextGCore live, Phase 6)
  # Port 7777 = NextGCore SBI port (HTTP/2 h2c), same convention as NWDAF.
  # Base path included directly -- NextGCore serves this API at
  # /nudr-dr/v2, not at root.
  UDR_BASE_URL: "http://udr.otel25-backends.svc.cluster.local:7777/nudr-dr/v2"

  # UDR HTTP transport protocol selection (Phase 6, same convention as NWDAF_PROTOCOL)
  UDR_PROTOCOL: "h2c"
