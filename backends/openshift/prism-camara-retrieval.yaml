apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-camara-retrieval
  namespace: otel25-backends
  labels:
    app: prism-camara-retrieval
    api: camara-retrieval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prism-camara-retrieval
  template:
    metadata:
      labels:
        app: prism-camara-retrieval
        api: camara-retrieval
    spec:
      containers:
      - name: prism
        image: image-registry.openshift-image-registry.svc:5000/otel25-backends/prism-camara-retrieval:latest
        ports:
        - containerPort: 4010
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 4010
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4010
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: prism-camara-retrieval
  namespace: otel25-backends
  labels:
    app: prism-camara-retrieval
    api: camara-retrieval
spec:
  selector:
    app: prism-camara-retrieval
  ports:
  - port: 4010
    targetPort: 4010
    protocol: TCP
  type: ClusterIP
