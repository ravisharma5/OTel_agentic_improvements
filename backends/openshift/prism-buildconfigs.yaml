# Prism mock BuildConfigs -- one per vendored OpenAPI spec (backends/specs/).
# Reconstructed 2026-10-13: these only ever existed live (sandbox1330/3435),
# never committed, discovered as a gap while deploying sandbox4001 from scratch.
# Each is a Binary build using backends/prism/Dockerfile (build context = backends/
# directory) with SPEC_FILE as the build arg selecting the vendored spec.
#
# Deploy: oc apply -f this-file.yaml, then for each name:
#   oc start-build <name> -n otel25-backends --from-dir=backends --follow
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: prism-camara-network-type
  namespace: otel25-backends
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: prism-camara-network-type
  namespace: otel25-backends
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: prism/Dockerfile
      buildArgs:
      - name: SPEC_FILE
        value: specs/camara_connected_network_type.yaml
  output:
    to:
      kind: ImageStreamTag
      name: prism-camara-network-type:latest
