# PostgreSQL backend for Langflow, replacing its default SQLite-on-PVC setup.
#
# 2026-10-13: Langflow's own data (most critically, the MCP Tools component's
# gateway URL -- hand-patched multiple times today during cluster cutovers)
# lived only in a single-pod SQLite file with no reconstruction script,
# unlike Keycloak's realm (recoverable via configure-keycloak.sh). A lost
# Langflow pod/PVC would have meant manually rebuilding the flow from
# scratch with no automated path -- now mitigated by committing a flow
# export (sdg/config/langflow-flow-backup.json) as a source of truth, and
# separately moving storage off SQLite's single-process-file model so
# Langflow itself could eventually run more than one replica if needed.
#
# This manifest includes the PVC hardening fix discovered the hard way on
# Keycloak's Postgres earlier the same day (data survives a pod reschedule),
# and gateway/openshift/ebs-volume-watchdog-cronjob.yaml is deployed here too
# (namespace otel25-sdg, a separate scoped IAM user for this cluster's AWS
# account) protecting against the matching stuck-EBS-attachment failure mode.
#
# Deliberately does NOT carry over Keycloak's control-plane node-affinity
# preference -- tried it first, then reverted after confirming it was
# actively counterproductive here: this cluster (sandbox2667) has exactly one
# control-plane node that's ALSO a heavily-loaded worker (GPU scheduling,
# KFP/DSPA components), unlike the gateway clusters where control-plane nodes
# are lightly-loaded and the preference made sense for stability. Confirmed
# live: with the affinity, the scheduler placed this pod on that one node at
# 93% CPU requests already; removing it let the scheduler pick a node at 10%
# instead. The lesson that generalizes, not the specific affinity rule: check
# actual per-node headroom before reusing a placement heuristic from a
# different cluster's topology.
#
# Resources and POSTGRESQL_MAX_CONNECTIONS=300 (below) are sized for 8
# concurrent Langflow worker processes (LANGFLOW_NUM_WORKERS=8 on
# langflow-service), each potentially holding its own SQLAlchemy connection
# pool -- the sclorg image's default max_connections=100 was a real risk of
# exhaustion under full concurrency, not just a theoretical one. Watch actual
# connection count (`SELECT count(*) FROM pg_stat_activity`) and pod CPU/mem
# under a real run before assuming this sizing is final.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-postgres-data
  namespace: otel25-sdg
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow-postgres
  namespace: otel25-sdg
  labels:
    app: langflow-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC -- a rolling update would deadlock trying to
                     # start a second pod before the first releases the volume.
  selector:
    matchLabels:
      app: langflow-postgres
  template:
    metadata:
      labels:
        app: langflow-postgres
    spec:
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: langflow-db-secret
              key: username
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langflow-db-secret
              key: password
        - name: POSTGRESQL_DATABASE
          value: langflow
        - name: POSTGRESQL_MAX_CONNECTIONS
          value: "300"
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langflow-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-postgres
  namespace: otel25-sdg
  labels:
    app: langflow-postgres
spec:
  selector:
    app: langflow-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
