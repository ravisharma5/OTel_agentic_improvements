# PostgreSQL backend for Langflow, replacing its default SQLite-on-PVC setup.
#
# 2026-10-13: Langflow's own data (most critically, the MCP Tools component's
# gateway URL -- hand-patched multiple times today during cluster cutovers)
# lived only in a single-pod SQLite file with no reconstruction script,
# unlike Keycloak's realm (recoverable via configure-keycloak.sh). A lost
# Langflow pod/PVC would have meant manually rebuilding the flow from
# scratch with no automated path -- now mitigated by committing a flow
# export (sdg/config/langflow-flow-backup.json) as a source of truth, and
# separately moving storage off SQLite's single-process-file model so
# Langflow itself could eventually run more than one replica if needed.
#
# This manifest already includes the two hardening fixes discovered the hard
# way on Keycloak's Postgres earlier the same day: a PVC (so data survives a
# pod reschedule) and a soft control-plane node-affinity preference. Known
# residual risk carried over from that incident: if the node holding this
# pod goes truly unreachable (not just restarted), the EBS volume can get
# stuck attached to the dead instance at the AWS API level -- see
# gateway/openshift/ebs-volume-watchdog-cronjob.yaml, which should be
# deployed here too (parameterize WATCHDOG_NAMESPACE=otel25-sdg and create a
# separate scoped IAM user for whichever AWS account this cluster lives in).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langflow-postgres-data
  namespace: otel25-sdg
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow-postgres
  namespace: otel25-sdg
  labels:
    app: langflow-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC -- a rolling update would deadlock trying to
                     # start a second pod before the first releases the volume.
  selector:
    matchLabels:
      app: langflow-postgres
  template:
    metadata:
      labels:
        app: langflow-postgres
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: langflow-db-secret
              key: username
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langflow-db-secret
              key: password
        - name: POSTGRESQL_DATABASE
          value: langflow
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langflow-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: langflow-postgres
  namespace: otel25-sdg
  labels:
    app: langflow-postgres
spec:
  selector:
    app: langflow-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
