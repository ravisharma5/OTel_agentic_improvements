# Curriculum Seed Taxonomy for SDG-02 Ordering
# ===============================================
#
# FIVE-TIER CURRICULUM
# --------------------
# Defines the seed scenario taxonomy for SDG-02's curriculum ordering,
# progressing from simple single-tool calls to complex closed-loop
# observe-decide-act cycles. Each tier has scenario templates with
# tool subsets, complexity ratings, and description templates.
#
# Each scenario's `name` is a stable identifier used as sdg_hub's
# mcp_server_name column (materialize_seeds.py) and for tool-coverage
# tracking/reporting (tool_coverage_report.py) -- do not rename an
# existing scenario without checking for downstream report references.
#
# NOTE ON USAGE: sdg_hub's real "MCP Server Distillation" flow does not
# consume `description`/`parameters`/`follow_up_prompts` as literal question
# text -- it generates its own questions from `tool_list` + `mcp_server_name`
# + `mcp_server_description` (fed from this scenario's `name`/`description`
# as grounding context) via its own exploration + question-generation blocks.
# `tool_subset` is still what matters most: it scopes which tools can appear
# together in a generated question, which is what keeps generation grounded
# to a coherent, production-realistic workflow instead of arbitrary tool
# combinations. `description`/`parameters`/`follow_up_prompts` are kept as
# human-readable documentation of original intent, not literal flow inputs.
#
# materialize_seeds.py reads this file and cross-references the tool
# subsets with the MCP Gateway's tools/list response to produce the
# structured seed dataset sdg_hub's training flow expects.
#
# References:
#   SDG-02: Curriculum ordering (single-tool to closed-loop)
#   04-RESEARCH.md: sdg_hub pipeline mechanics, seed DataFrame structure

tiers:

  # ─── Tier 1: Single Tool ────────────────────────────────────────────────
  # Individual tool calls exercising each domain independently.
  # Complexity: 1 (simplest -- one tool, one action)

  single_tool:
    complexity: 1
    description: Single-tool calls exercising individual domain APIs
    scenarios:
      - name: single_check_alarms
        tool_subset: [tmf642listAlarm]
        description: "Check for {severity} alarms on the network"
        parameters:
          severity: [critical, major, minor, warning]

      - name: single_list_performance_jobs
        tool_subset: [tmf628listMeasurementCollectionJob]
        description: "List performance monitoring jobs"
        parameters: {}

      - name: single_create_trouble_ticket
        tool_subset: [tmf621createTroubleTicket]
        description: "Create a trouble ticket for {category} issue"
        parameters:
          category: [network, hardware, software, security]

      - name: single_get_nwdaf_analytics
        tool_subset: [nwdafget_nwdaf_analytics]
        description: "Get network analytics for {analytics_type}"
        # 2026-10-14: narrowed to NF_LOAD only. UE_MOBILITY and
        # QOS_SUSTAINABILITY were here before, but UE_MOBILITY was directly
        # confirmed to return empty data (HTTP 204) even with live UE/PDU
        # traffic flowing during Phase 1's validation
        # (01-02-nwdaf-validation-findings.md) -- NF_LOAD is the only event
        # type that validation ever got real data back for.
        # QOS_SUSTAINABILITY was never confirmed working either. This was
        # also dead code until now (see materialize_seeds.py's parameter
        # substitution fix, same date) -- the live pipeline was generating
        # questions about SERVICE_EXPERIENCE/NETWORK_PERFORMANCE/etc.,
        # none of which were ever in this list or confirmed supported.
        parameters:
          analytics_type: [NF_LOAD]

      - name: single_verify_device_location
        tool_subset: [camaraverify_location]
        description: "Verify device location for {device_id}"
        parameters:
          device_id: [ue-001, ue-002, ue-003]

      - name: single_show_interfaces
        tool_subset: [telecomshow_interfaces]
        description: "Show network interfaces on {device}"
        parameters:
          device: [router-lab-01, switch-core-01]

      - name: single_show_bgp_summary
        tool_subset: [telecomshow_bgp_summary]
        description: "Display BGP neighbor summary on {device}"
        parameters:
          device: [router-lab-01, router-edge-01]

      - name: single_check_authentication_subscription
        tool_subset: [udrget_authentication_subscription]
        description: "Check authentication subscription data for {supi}"
        parameters:
          supi: [imsi-999700000000001, imsi-999700000000002]

      - name: single_check_roaming_status
        tool_subset: [devicestatusget_roaming_status]
        description: "Check roaming status for {device_id}"
        parameters:
          device_id: [ue-001, ue-002, ue-003]

      - name: single_check_reachability_status
        tool_subset: [devicestatusget_reachability_status]
        description: "Check reachability status for {device_id}"
        parameters:
          device_id: [ue-001, ue-002, ue-003]

      - name: single_check_network_type
        tool_subset: [devicestatusget_connected_network_type]
        description: "Check connected network type for {device_id}"
        parameters:
          device_id: [ue-001, ue-002, ue-003]

  # ─── Tier 2: Parallel ──────────────────────────────────────────────────
  # Independent tool calls to different domains that can run simultaneously.
  # Complexity: 2 (multiple tools, no dependencies between them)

  parallel:
    complexity: 2
    description: Independent tool calls to different domains executed simultaneously
    scenarios:
      - name: parallel_alarms_and_tickets
        tool_subset: [tmf642listAlarm, tmf621listTroubleTicket]
        description: "Check alarms and open tickets simultaneously"
        parameters: {}

      - name: parallel_analytics_and_interfaces
        tool_subset: [nwdafget_nwdaf_analytics, telecomshow_interfaces]
        description: "Gather network analytics and interface status in parallel"
        parameters: {}

      - name: parallel_perf_jobs_and_alarms
        tool_subset: [tmf628listMeasurementCollectionJob, tmf642listAlarm]
        description: "Review performance jobs and current alarms together"
        parameters: {}

      - name: parallel_location_and_analytics
        tool_subset: [camaraverify_location, nwdafget_nwdaf_analytics]
        description: "Verify device location while checking network load"
        parameters: {}

      - name: parallel_roaming_and_location
        tool_subset: [devicestatusget_roaming_status, camaraverify_location]
        description: "Check roaming status and verify device location simultaneously"
        parameters: {}

  # ─── Tier 3: Sequential ────────────────────────────────────────────────
  # Dependent tool chains where each call depends on the previous result.
  # Complexity: 3 (tool dependencies, result threading)

  sequential:
    complexity: 3
    description: Dependent tool chains where each call uses results from the previous
    scenarios:
      - name: sequential_alarm_to_ticket
        tool_subset: [tmf642listAlarm, tmf642retrieveAlarm, tmf621createTroubleTicket]
        description: "List alarms, get details for the critical one, create a trouble ticket"
        parameters: {}

      - name: sequential_perf_job_to_tracking
        tool_subset: [tmf628listMeasurementCollectionJob, tmf628retrieveTrackingRecord]
        description: "List performance monitoring jobs, then get detailed tracking record for the failing one"
        parameters: {}

      - name: sequential_interfaces_to_detail
        tool_subset: [telecomshow_interfaces, telecomshow_interface_detail]
        description: "List all interfaces, then get detailed stats for the one with errors"
        parameters: {}

      - name: sequential_alarm_to_analytics
        tool_subset: [tmf642listAlarm, nwdafget_nwdaf_analytics]
        description: "List alarms, then check network analytics to correlate with alarm source"
        parameters: {}

      - name: sequential_analytics_to_auth_check
        tool_subset: [nwdafget_nwdaf_analytics, udrget_authentication_subscription]
        description: "Check network analytics for a device, then verify its authentication subscription state if anomalies are found"
        parameters: {}

      - name: sequential_alarm_to_roaming_check
        tool_subset: [tmf642listAlarm, devicestatusget_roaming_status]
        description: "List alarms, then check roaming status for the affected device"
        parameters: {}

  # ─── Tier 4: Multi-Turn ────────────────────────────────────────────────
  # User follow-up questions building on previous tool call results.
  # Complexity: 4 (conversation context, follow-up reasoning)

  multi_turn:
    complexity: 4
    description: User follow-up questions building on previous tool call results
    scenarios:
      - name: multiturn_alarm_ticket_followup
        tool_subset: [tmf642listAlarm, tmf642retrieveAlarm, tmf621createTroubleTicket]
        description: "List alarms, get details, create ticket, then follow up on ticket status"
        follow_up_prompts:
          - "What is the status of the ticket I just created?"
          - "Can you add more details about the alarm to the ticket?"

      - name: multiturn_perf_trend_followup
        tool_subset: [tmf628listMeasurementCollectionJob, tmf628retrieveTrackingRecord]
        description: "List jobs, get tracking record, then ask about trends"
        follow_up_prompts:
          - "How does this compare to yesterday's performance?"
          - "Which interfaces are affected by this degradation?"

      - name: multiturn_analytics_interface_followup
        tool_subset: [nwdafget_nwdaf_analytics, telecomshow_interfaces, telecomshow_interface_detail]
        description: "Check analytics, review interfaces, then drill into specific interface"
        follow_up_prompts:
          - "Show me more details on the interface with the highest error rate"
          - "Is there an alarm associated with this interface?"

  # ─── Tier 5: Closed Loop ──────────────────────────────────────────────
  # Observe-decide-act cycles that combine multiple domains for end-to-end
  # fault prediction and remediation workflows.
  # Complexity: 5 (most complex -- observation, correlation, action)

  closed_loop:
    complexity: 5
    description: Observe-decide-act cycles combining multiple domains for fault prediction
    scenarios:
      - name: closed_loop_alarm_correlation_remediation
        tool_subset:
          - tmf642listAlarm
          - nwdafget_nwdaf_analytics
          - telecomshow_interface_detail
          - tmf642acknowledge_alarm
          - tmf621createTroubleTicket
        description: "Detect alarm, correlate with network analytics, verify interface status, acknowledge alarm, create ticket"
        parameters: {}

      - name: closed_loop_performance_degradation
        tool_subset:
          - tmf628listMeasurementCollectionJob
          - tmf628retrieveTrackingRecord
          - tmf642listAlarm
          - nwdafget_nwdaf_analytics
          - tmf621createTroubleTicket
        description: "Detect performance degradation, get tracking details, check for related alarms, verify with analytics, open incident ticket"
        parameters: {}

      - name: closed_loop_interface_fault_escalation
        tool_subset:
          - telecomshow_interfaces
          - telecomshow_interface_detail
          - tmf642listAlarm
          - camaraverify_location
          - tmf621createTroubleTicket
        description: "Monitor interface errors, investigate affected interface, check for alarms, verify device location, escalate as trouble ticket"
        parameters: {}

      - name: closed_loop_device_connectivity_investigation
        tool_subset:
          - tmf642listAlarm
          - devicestatusget_roaming_status
          - devicestatusget_reachability_status
          - nwdafget_nwdaf_analytics
          - tmf621createTroubleTicket
        description: "Check for alarms, check the affected device's roaming and reachability status, correlate with network analytics, create a ticket if a fault is confirmed"
        parameters: {}

      - name: closed_loop_device_security_anomaly_investigation
        tool_subset:
          - tmf642listAlarm
          - udrget_authentication_subscription
          - camaraverify_location
          - devicestatusget_roaming_status
          - tmf621createTroubleTicket
        description: "Detect a suspicious alarm, verify the device's authentication subscription is valid, check its current location and roaming status, escalate with a ticket if something looks wrong"
        parameters: {}
