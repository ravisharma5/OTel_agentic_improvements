# sdg_hub MCP Server Distillation Training Flow Overrides
# ========================================================
#
# FLOW CONFIGURATION
# ------------------
# Overrides the default flow.yaml from sdg_hub's mcp_distillation_training
# example flow. Configures the teacher model (Gemini 3.8 Flash via the
# Gemini Developer API / AI Studio, see Teacher Model section below --
# previously self-hosted Gemma 4 31B via vLLM) and the Langflow agent
# (wrapping MCP Gateway tools).
#
# ENV-VAR INTERPOLATION CONVENTION
# ---------------------------------
# Values like ${VLLM_API_KEY} are NOT expanded by yaml.safe_load().
# The pipeline scripts (run-generation.py, run-evaluation.py) and notebooks
# use sdg/scripts/load_config.py to load these files with
# os.path.expandvars() on string values before passing to sdg_hub.
# Alternatively, set the env vars and the scripts handle interpolation
# at load time.
#
# Without this step, yaml.safe_load() returns the literal string
# "${VLLM_API_KEY}" which will fail at runtime.
#
# References:
#   D-01: sdg_hub (Red Hat AI Innovation Team) as SDG framework
#   D-02: mcp_distillation_training flow for generation
#   D-08: Gemma 4 31B dense as teacher model
#   D-09: vLLM --tool-call-parser gemma4

# ─── Teacher Model ──────────────────────────────────────────────────────────
# 2026-10-12: switched from `vertex_ai/gemini-3.8-flash` to
# `gemini/gemini-3.8-flash` (LiteLLM's Gemini Developer API / AI Studio
# provider) after the Vertex AI path hit a real, external blocker: the
# `sdg-pipeline-vertex@na-telco-adoption.iam.gserviceaccount.com` service
# account's GOOGLE_APPLICATION_CREDENTIALS auth worked (fixed a prior
# DefaultCredentialsError), but the account has zero IAM role bindings on
# na-telco-adoption and neither the project owner's nor this session's
# gcloud identity has `setIamPolicy` rights to grant `roles/aiplatform.user`
# -- confirmed live via a direct `aiplatform.endpoints.predict` 403. That
# grant needs someone with Owner/IAM Admin on the project; revisit the
# Vertex path once it lands (the service-account Secret and its mounting
# code in sdg_production_pipeline.py were left in place, just unused).
#
# The Gemini Developer API sidesteps GCP IAM entirely -- auth is a plain API
# key via the GEMINI_API_KEY env var (LiteLLM reads it automatically; no
# credential field belongs in this YAML). Confirmed live with a direct
# generateContent call against generativelanguage.googleapis.com before
# wiring it in.
#
# Validated end-to-end through sdg_hub's LLMChatBlock in a real KFP run
# (2026-10-12) -- unlike the Vertex path, this one actually got past
# generate_questions successfully.

model_config:
  model: gemini/gemini-3.8-flash
  # History: max_tokens was capped at 1024 then 350 under the old Gemma 4/
  # vLLM setup to dodge a 504 that turned out to be an AWS ELB idle-timeout
  # issue, fixed by sdg/lib/streaming_llm_chat_block.py (every LLMChatBlock
  # streams internally now). Left at 2048 here since the same quality-check
  # prompt (detailed reasoning before each of 6 rating tags) still needs
  # room to complete without truncating before its closing tag, which would
  # make parse_quality_score's TagParserBlock find nothing and raise
  # EmptyDatasetError -- that failure mode isn't specific to Gemma 4.
  max_tokens: 2048

# ─── Agent Framework ────────────────────────────────────────────────────────
# sdg_hub's AgentBlock requires an agent framework (Langflow or LangGraph)
# as an intermediary to the MCP Gateway. The agent handles tool selection,
# parameter filling, and trace capture.

agent_config:
  agent_framework: langflow
  agent_url: "${LANGFLOW_URL:-http://langflow.rhoai-sdg.svc:7860/api/v1/run/default}"
  agent_api_key: "${LANGFLOW_API_KEY}"

# ─── Runtime Parameters ─────────────────────────────────────────────────────
# These override the flow's default block parameters for volume and diversity.
#
# multiply_tool_rows.num_samples: How many copies of each tool row to create
#   before sampling (controls diversity via different random subsets).
# sample_tools.num_samples: How many tools to include in each generated
#   question (3-tool subsets create more complex scenarios).
#
# sample_tools.num_samples below is a fallback only -- run-generation.py's
# _run_generation() overrides it per tier (production runs), derived from
# the smallest tool_list size actually present in that tier's seeds, so
# single_tool never over-samples and closed_loop can use up to 5. This
# static value only applies if that per-tier computation is bypassed.

runtime_params:
  multiply_tool_rows:
    num_samples: 20
  sample_tools:
    num_samples: 3

# ─── Quality Thresholds ─────────────────────────────────────────────────────
# These control the ColumnValueFilterBlock gates in the training flow.
# Rows with quality below these thresholds are filtered out.

quality_thresholds:
  question_quality_min: good
  response_quality_min: mostly complete
