# PIPELINE DEFINITION
# Name: sdg-production-pipeline
# Description: Generate telecom tool-calling training examples per tier (tool-coverage gated, one artifact per tier), report coverage, and run three-stage evaluation + OSFT delivery. See .planning/phases/04-sdg-pipeline-and-dataset-production/04-LEARNINGS.md for the rejection-sampling and per-tier-split design rationale.
# Inputs:
#    client_id: str [Default: 'sdg-pipeline']
#    gateway_url: str [Default: 'https://mcp.apps.cluster-vrwj7.vrwj7.sandbox4001.opentlc.com/mcp']
#    keycloak_url: str [Default: 'https://mcp-keycloak-otel25-gateway.apps.cluster-vrwj7.vrwj7.sandbox4001.opentlc.com']
components:
  comp-coverage-report:
    executorLabel: exec-coverage-report
