deploymentSpec:
  executors:
    exec-coverage-report:
      container:
        args:
        - set -e; for d in "$1" "$2" "$3" "$4" "$5"; do cat "$d"/*_raw.jsonl 2>/dev/null
          || true; done > /tmp/all_tiers_raw.jsonl; python3 -m sdg.scripts.tool_coverage_report
          --input /tmp/all_tiers_raw.jsonl --seed-scenarios sdg/config/seed-scenarios.yaml
          --output-dir "$6"
        - coverage_report
        - '{{$.inputs.artifacts[''raw_single_tool''].path}}'
        - '{{$.inputs.artifacts[''raw_parallel''].path}}'
        - '{{$.inputs.artifacts[''raw_sequential''].path}}'
        - '{{$.inputs.artifacts[''raw_multi_turn''].path}}'
        - '{{$.inputs.artifacts[''raw_closed_loop''].path}}'
        - '{{$.outputs.artifacts[''report''].path}}'
        command:
        - sh
        - -c
        image: image-registry.openshift-image-registry.svc:5000/otel25-sdg/sdg-pipeline:latest
    exec-evaluate-and-deliver:
      container:
        args:
        - set -e; mkdir -p /tmp/merged_raw; for d in "$1" "$2" "$3" "$4" "$5"; do
          cp "$d"/*_raw.jsonl /tmp/merged_raw/ 2>/dev/null || true; done; python3
          -m sdg.scripts.run-evaluation --input-dir /tmp/merged_raw --output-dir "$6"
          --delivery-dir "$7"
        - evaluate_and_deliver
        - '{{$.inputs.artifacts[''raw_single_tool''].path}}'
        - '{{$.inputs.artifacts[''raw_parallel''].path}}'
        - '{{$.inputs.artifacts[''raw_sequential''].path}}'
        - '{{$.inputs.artifacts[''raw_multi_turn''].path}}'
        - '{{$.inputs.artifacts[''raw_closed_loop''].path}}'
        - '{{$.outputs.artifacts[''filtered_output''].path}}'
        - '{{$.outputs.artifacts[''delivery_output''].path}}'
        command:
        - sh
        - -c
        env:
        - name: VLLM_API_BASE
          value: https://ai-inference.apps.cluster-qbq4v.qbq4v.sandbox2667.opentlc.com/models/redhataigemma-4-31b-it/v1
        - name: LANGFLOW_URL
          value: http://langflow-service-backend.otel25-sdg.svc.cluster.local:7860/api/v1/run/90d9df0e-6bdd-465b-8064-385998b1a437
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/secrets/gcp/key.json
        image: image-registry.openshift-image-registry.svc:5000/otel25-sdg/sdg-pipeline:latest
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.25
          memoryLimit: 1.073741824
          memoryRequest: 0.536870912
    exec-generate-tier:
      container:
        args:
        - --tiers
        - '{{$.inputs.parameters[''tier'']}}'
        - --output-dir
        - '{{$.outputs.artifacts[''raw_output''].path}}'
        - --gateway-url
        - '{{$.inputs.parameters[''gateway_url'']}}'
        - --keycloak-url
        - '{{$.inputs.parameters[''keycloak_url'']}}'
        - --client-id
        - '{{$.inputs.parameters[''client_id'']}}'
        - --checkpoint-dir
        - /checkpoints
        command:
