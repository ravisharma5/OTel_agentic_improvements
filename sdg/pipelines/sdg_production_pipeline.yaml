pipelineInfo:
  description: Generate telecom tool-calling training examples per tier (tool-coverage
    gated, one artifact per tier), report coverage, and run three-stage evaluation
    + OSFT delivery. See .planning/phases/04-sdg-pipeline-and-dataset-production/04-LEARNINGS.md
    for the rejection-sampling and per-tier-split design rationale.
  name: sdg-production-pipeline
root:
  dag:
    tasks:
      coverage-report:
        cachingOptions: {}
        componentRef:
          name: comp-coverage-report
        dependentTasks:
        - generate-tier
        - generate-tier-2
        - generate-tier-3
        - generate-tier-4
        - generate-tier-5
        inputs:
          artifacts:
            raw_closed_loop:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-5
            raw_multi_turn:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-4
            raw_parallel:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-2
            raw_sequential:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-3
            raw_single_tool:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier
        taskInfo:
          name: coverage-report
      evaluate-and-deliver:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-and-deliver
        dependentTasks:
        - generate-tier
        - generate-tier-2
        - generate-tier-3
        - generate-tier-4
        - generate-tier-5
        inputs:
          artifacts:
            raw_closed_loop:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-5
            raw_multi_turn:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-4
            raw_parallel:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-2
            raw_sequential:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier-3
            raw_single_tool:
              taskOutputArtifact:
                outputArtifactKey: raw_output
                producerTask: generate-tier
        taskInfo:
          name: evaluate-and-deliver
      generate-tier:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-tier
        inputs:
          parameters:
            client_id:
              componentInputParameter: client_id
            gateway_url:
              componentInputParameter: gateway_url
            keycloak_url:
              componentInputParameter: keycloak_url
            tier:
              runtimeValue:
                constant: single_tool
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 86400s
          maxRetryCount: 5
        taskInfo:
          name: generate-tier
      generate-tier-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-tier-2
        dependentTasks:
        - generate-tier
        inputs:
          parameters:
            client_id:
              componentInputParameter: client_id
            gateway_url:
              componentInputParameter: gateway_url
            keycloak_url:
              componentInputParameter: keycloak_url
            tier:
              runtimeValue:
                constant: parallel
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 86400s
          maxRetryCount: 5
        taskInfo:
          name: generate-tier-2
      generate-tier-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-tier-3
        dependentTasks:
        - generate-tier-2
        inputs:
          parameters:
            client_id:
              componentInputParameter: client_id
            gateway_url:
              componentInputParameter: gateway_url
            keycloak_url:
              componentInputParameter: keycloak_url
            tier:
              runtimeValue:
                constant: sequential
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 86400s
          maxRetryCount: 5
        taskInfo:
          name: generate-tier-3
      generate-tier-4:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-tier-4
        dependentTasks:
        - generate-tier-3
        inputs:
          parameters:
            client_id:
              componentInputParameter: client_id
            gateway_url:
              componentInputParameter: gateway_url
            keycloak_url:
              componentInputParameter: keycloak_url
            tier:
              runtimeValue:
                constant: multi_turn
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 86400s
          maxRetryCount: 5
        taskInfo:
          name: generate-tier-4
      generate-tier-5:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-tier-5
        dependentTasks:
        - generate-tier-4
        inputs:
          parameters:
            client_id:
              componentInputParameter: client_id
            gateway_url:
              componentInputParameter: gateway_url
            keycloak_url:
              componentInputParameter: keycloak_url
            tier:
              runtimeValue:
                constant: closed_loop
        retryPolicy:
          backoffDuration: 60s
          backoffFactor: 2.0
          backoffMaxDuration: 86400s
          maxRetryCount: 5
        taskInfo:
          name: generate-tier-5
  inputDefinitions:
    parameters:
      client_id:
        defaultValue: sdg-pipeline
        isOptional: true
        parameterType: STRING
      gateway_url:
        defaultValue: https://mcp.apps.cluster-vrwj7.vrwj7.sandbox4001.opentlc.com/mcp
        isOptional: true
        parameterType: STRING
      keycloak_url:
        defaultValue: https://mcp-keycloak-otel25-gateway.apps.cluster-vrwj7.vrwj7.sandbox4001.opentlc.com
        isOptional: true
        parameterType: STRING
