# HTTPRoute: route MCP traffic to CAMARA device location backend
# Points to mcp-camara Service in otel25-mcp (cross-namespace via ReferenceGrant)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-camara-route
  namespace: otel25-gateway
  labels:
    mcp-server: "true"
spec:
  hostnames:
  - camara.mcp.local
  parentRefs:
  - name: mcp-gateway
    namespace: otel25-gateway
  rules:
  - backendRefs:
    - name: mcp-camara
      namespace: otel25-mcp
      port: 8000
