# MCPServerRegistration: register TMF621 trouble ticket MCP server
# Prefix "tmf621" -- all discovered tools prefixed with tmf621_
# targetRef points to the HTTPRoute that routes to mcp-tmf621 backend
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: tmf621
  namespace: otel25-gateway
spec:
  prefix: tmf621
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-tmf621-route
  path: /mcp
