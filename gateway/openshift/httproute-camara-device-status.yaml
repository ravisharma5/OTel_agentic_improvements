# HTTPRoute: route MCP traffic to CAMARA Device Status backend
# Points to mcp-camara-device-status Service in otel25-mcp (cross-namespace via ReferenceGrant)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-camara-device-status-route
  namespace: otel25-gateway
  labels:
    mcp-server: "true"
spec:
  hostnames:
  - camara-device-status.mcp.local
  parentRefs:
  - name: mcp-gateway
    namespace: otel25-gateway
  rules:
  - backendRefs:
    - name: mcp-camara-device-status
      namespace: otel25-mcp
      port: 8000
