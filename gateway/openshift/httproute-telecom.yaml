# HTTPRoute: route MCP traffic to MCP-Telecom infrastructure backend
# Points to mcp-telecom Service in otel25-mcp (cross-namespace via ReferenceGrant)
# MCP-Telecom was deployed in Phase 2 with 58 device-layer tools
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-telecom-route
  namespace: otel25-gateway
  labels:
    mcp-server: "true"
spec:
  hostnames:
  - telecom.mcp.local
  parentRefs:
  - name: mcp-gateway
    namespace: otel25-gateway
  rules:
  - backendRefs:
    - name: mcp-telecom
      namespace: otel25-mcp
      port: 8000
