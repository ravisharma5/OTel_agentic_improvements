# RHCL dependency operators -- installed in openshift-operators (AllNamespaces mode)
# because they do not support OwnNamespace InstallModeType.
# Required by RHCL operator which reconciles AuthPolicy CRDs.
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: dns-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: dns-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: limitador-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: limitador-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
