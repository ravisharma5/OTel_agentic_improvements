# PostgreSQL for Keycloak (WG training pipeline, not production)
#
# The keycloak-db-secret Secret is deliberately NOT defined here with a real value.
# Create it before applying this manifest with gateway/openshift/create-keycloak-db-secret.sh,
# which generates a random password and is idempotent (safe to re-run; it will not
# overwrite an existing secret, so Postgres data isn't orphaned by a password change).
#
# 2026-10-13: added a PVC after a live incident on sandbox3435 -- a worker node went
# NotReady and stranded the (then-ephemeral) single-replica Postgres pod; losing the
# realm on every such restart required re-running configure-keycloak.sh and re-syncing
# the sdg-pipeline client secret cross-cluster every time. The realm/clients/secrets now
# survive a pod reschedule. Postgres remains a single-writer, single-replica component
# (no HA) -- the PVC only protects against data loss on pod move, not against the pod
# itself being briefly unavailable during a reschedule.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-data
  namespace: otel25-gateway
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  namespace: otel25-gateway
  labels:
    app: keycloak-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC -- a rolling update would deadlock trying to start a
                     # second pod before the first releases the volume.
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      labels:
        app: keycloak-postgres
    spec:
      # Prefer a control-plane node: in these sandbox clusters, control-plane nodes
      # have proven more stable than workers (the sandbox3435 incident this guards
      # against was a worker-node outage). Soft preference, not a hard requirement,
      # so scheduling still succeeds if the control plane is full.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-16:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: keycloak-db-secret
              key: username
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db-secret
              key: password
        - name: POSTGRESQL_DATABASE
          value: keycloak
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: keycloak-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: otel25-gateway
  labels:
    app: keycloak-postgres
spec:
  selector:
    app: keycloak-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
# Keycloak instance for MCP Gateway JWT authentication
#
# 2026-10-13: instances raised 1->2 with anti-affinity after a live incident on
# sandbox3435 -- a worker node went NotReady and stranded the single Keycloak pod
# (StatefulSet, no failover) in Terminating limbo for hours with zero running
# replicas, breaking the whole pipeline. RHBK/Keycloak supports multi-instance
# clustering out of the box (Infinispan-based distributed session cache, peer
# discovery via the Kubernetes API) against the one shared Postgres backend --
# no additional config needed beyond instances>1. This does NOT make Postgres
# itself HA (see keycloak-postgres Deployment above), but it does mean one bad
# node can no longer take Keycloak itself to zero replicas.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: mcp-keycloak
  namespace: otel25-gateway
  labels:
    app: keycloak
    purpose: mcp-auth
spec:
  instances: 2
  db:
    vendor: postgres
    host: keycloak-postgres
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  hostname:
    hostname: mcp-keycloak-otel25-gateway.${GATEWAY_APPS_DOMAIN}
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  unsupported:
    podTemplate:
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: keycloak
                topologyKey: kubernetes.io/hostname
