# MCPServerRegistration: register TMF628 performance management MCP server
# Prefix "tmf628" -- all discovered tools prefixed with tmf628_
# targetRef points to the HTTPRoute that routes to mcp-tmf628 backend
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: tmf628
  namespace: otel25-gateway
spec:
  prefix: tmf628
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-tmf628-route
  path: /mcp
