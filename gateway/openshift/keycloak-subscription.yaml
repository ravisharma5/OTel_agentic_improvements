# Red Hat build of Keycloak Operator
# Provides the Keycloak CRD for deploying Keycloak instances
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: keycloak-og
  namespace: otel25-gateway
spec:
  targetNamespaces:
  - otel25-gateway
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: otel25-gateway
spec:
  channel: stable-v26
  installPlanApproval: Automatic
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
