# HTTPRoute: route MCP traffic to NWDAF analytics backend
# Points to mcp-nwdaf Service in otel25-mcp (cross-namespace via ReferenceGrant)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-nwdaf-route
  namespace: otel25-gateway
  labels:
    mcp-server: "true"
spec:
  hostnames:
  - nwdaf.mcp.local
  parentRefs:
  - name: mcp-gateway
    namespace: otel25-gateway
  rules:
  - backendRefs:
    - name: mcp-nwdaf
      namespace: otel25-mcp
      port: 8000
